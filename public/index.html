<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>triage — email classifier · jev</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="bg-grid" aria-hidden="true"></div>

  <header class="topbar">
    <div class="brand">
      <span class="mark" aria-hidden="true"></span>
      <span class="wordmark">triage</span>
      <span class="divider">/</span>
      <span class="sub">email classifier</span>
    </div>
    <div class="status">
      <span class="pill" id="model-pill" title="Model">jev-1.13.0</span>
      <span class="live"><span class="dot" id="live-dot"></span><span id="live-label">connecting…</span></span>
    </div>
  </header>

  <main class="layout">
    <section class="card composer rise" style="--d:0ms">
      <div class="card-head">
        <h2>Compose</h2>
        <select id="sample" aria-label="Load sample email">
          <option value="">Load a sample…</option>
        </select>
      </div>
      <label class="field">
        <span>Subject</span>
        <input id="subject" type="text" placeholder="Stripe integration failing — losing sales" autocomplete="off" />
      </label>
      <div class="row2">
        <label class="field">
          <span>From</span>
          <input id="from" type="text" placeholder="customer@acme.com" autocomplete="off" />
        </label>
        <label class="field">
          <span>Latency</span>
          <div class="latency" id="latency">— ms</div>
        </label>
      </div>
      <label class="field">
        <span>Body</span>
        <textarea id="body" rows="7" placeholder="Paste the email body here…"></textarea>
      </label>
      <div class="controls">
        <label class="slider">
          <span>Quarantine ≥ <b id="q-val">0.80</b></span>
          <input id="q-thresh" type="range" min="0.5" max="0.95" step="0.05" value="0.8" />
        </label>
        <label class="slider">
          <span>Review below <b id="r-val">0.60</b></span>
          <input id="r-thresh" type="range" min="0.3" max="0.9" step="0.05" value="0.6" />
        </label>
      </div>
      <button id="go" class="go">
        <span class="go-label">Classify</span>
        <span class="go-key">↵</span>
      </button>
    </section>

    <section class="card result rise" style="--d:90ms" id="result-card" aria-live="polite">
      <div class="card-head">
        <h2>Decision</h2>
        <span class="pill ghost" id="qset">EMAIL_Q_V1</span>
      </div>
      <div id="result-body">
        <div class="empty">
          <div class="empty-ring" aria-hidden="true"></div>
          <p>No email classified yet.<br />Compose one, or pick a sample.</p>
        </div>
      </div>
    </section>

    <section class="card inbox rise" style="--d:180ms">
      <div class="card-head">
        <h2>Demo inbox</h2>
        <span class="pill ghost" id="inbox-count">—</span>
      </div>
      <div id="inbox-list" class="inbox-list">
        <div class="inbox-loading"><span class="dot pulse"></span> scoring inbox…</div>
      </div>
    </section>
  </main>

  <footer class="foot">
    <span id="meta">model — · question set — · tokens —</span>
    <span class="foot-right">one jev call per email · choice + noul + score in parallel</span>
  </footer>

<script src="app.js"></script>
</body>
</html>
